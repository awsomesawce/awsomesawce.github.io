<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Carl Capodice</title>
<style>
  :root{
    --bg:#0d1117; --line:#232b36; --text:#dce3ea; --text-dim:#8b96a3;
    --accent:#6fd08c; --accent-dim:#3f7a52;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,Menlo,monospace;
    --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.7}
  .wrap{max-width:680px; margin:0 auto; padding:56px 24px 80px}
  a{color:var(--accent)}
  .back{font-family:var(--mono); font-size:13px; color:var(--text-dim); display:inline-block; margin-bottom:32px}
  .meta{font-family:var(--mono); font-size:13px; color:var(--text-dim); margin-bottom:8px}
  h1{font-family:var(--mono); font-size:clamp(24px,4vw,32px); margin:0 0 24px; line-height:1.3}
  article{max-width:66ch}
  article h2{font-family:var(--mono); font-size:18px; margin-top:36px}
  article p{margin:0 0 16px}
  article pre{background:#11171f; border:1px solid var(--line); padding:16px; overflow-x:auto; border-radius:4px}
  article code{font-family:var(--mono); font-size:13.5px}
  article :not(pre) > code{background:#11171f; padding:1px 5px; border-radius:3px}
  article a{text-decoration:underline}
  article ul, article ol{padding-left:22px}
  hr{border:none; border-top:1px solid var(--line); margin:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/blog/">&larr; back to posts</a>
  <div class="meta">{{ page.date | date: "%B %-d, %Y" }}</div>
  <h1>{{ page.title }}</h1>
  <article>
    {{ content }}
  </article>
</div>
</body>
</html>
